name: Build APK and Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/IrisResearchAnalyzer-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "release/IrisResearchAnalyzer-v1.0.${GITHUB_RUN_NUMBER}.apk" \
            --title "IrisResearchAnalyzer $TAG" \
            --notes "Android APK built automatically from commit ${GITHUB_SHA}."

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrisResearchAnalyzer-debug-apk
          path: release/*.apk
          if-no-files-found: error
